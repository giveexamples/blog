<style>

#search-modal {
    display: none;
    position: fixed;
    z-index: 9999;

    top: 0;

    height: 100%;
    background-color: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(5px);
}

#search-modal.active {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 10vh;
}

.search-content {
    background-color: var(--entry);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    width: 90%;
    max-width: 600px;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}

.search-header {
    display: flex;
    align-items: center;
    margin-bottom: 15px;
}

#modal-search-input {

    border-radius: 4px;
    background-color: var(--theme);
    color: var(--primary);
}

#modal-search-input:focus {
    outline: none;
    border-color: var(--tertiary);
}

.search-close {
    margin-left: 10px;
    padding: 8px 15px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    color: var(--primary);
}

.search-close:hover {

}

    padding: 0;

}

}

#modal-search-results li a {

}

#modal-search-results .search-item-summary {

    opacity: 0.8;
}

#search-button {
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 5px;

    align-items: center;
    color: var(--primary);

}

#search-button svg {

    height: 20px;
