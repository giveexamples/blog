baseURL = 'https://giveexamples.github.io/blog/'
relativeURLs = false
canonifyURLs = true
languageCode = 'en-us'
title = '🏠 GiveExamples'
theme = "PaperMod"

[services.googleAnalytics]
ID = "G-J3LM16S9PR"

[outputs]
home = ["HTML", "RSS", "JSON"]

[[menu.main]]
name = "Articles"
url = "/articles/"
weight = 5

[[menu.main]]
name = "Archive"
url = "/archives/"
weight = 8

[[menu.main]]
name = "Tags"
url = "/tags/"
weight = 9

[[menu.main]]
name = "About"
url = "/about/"
weight = 10

[params]
ShowTags = true

[params.assets]
favicon = "/blog/favicon.ico"
favicon16x16 = "/blog/favicon-16x16.png"
favicon32x32 = "/blog/favicon-32x32.png"

# Giscus Comments Configuration
# Get your repo-id and category-id from: https://giscus.app
[params.giscus]
repo = "giveexamples/blog"
repoID = "REPLACE_WITH_YOUR_REPO_ID"  # Visit https://giscus.app to get this
category = "Announcements"
categoryID = "REPLACE_WITH_YOUR_CATEGORY_ID"  # Visit https://giscus.app to get this
mapping = "pathname"
strict = "0"
reactionsEnabled = "1"
emitMetadata = "0"
inputPosition = "bottom"
theme = "preferred_color_scheme"  # Auto switches between light/dark based on site theme
lang = "en"
loading = "lazy"

[[params.socialIcons]]
name = "github"
url = "https://github.com/giveexamples"